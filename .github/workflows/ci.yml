name: CI Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://carlosvalderrama.dev
      STRAPI_URL: http://localhost:1337

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript types
        run: npm run typecheck

      - name: Validate ESLint rules
        run: npm run lint

      - name: Execute domain and presentation unit tests
        run: npm test

      - name: Build Next.js production bundle
        run: npm run build

      - name: Execute End-to-End functional verification
        run: npm run test:e2e
